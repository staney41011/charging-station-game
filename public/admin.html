<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>主持人後台</title>
  <link rel="stylesheet" href="./style.css?v=dev15-20260625-2" />
</head>

<body class="admin-body">
  <main class="shell page admin-shell">
    <section class="hero card admin-hero">
      <p class="eyebrow">控制室</p>
      <h1>主持人後台</h1>
      <p class="lede">建立隊伍、啟動遊戲、釋放魔王與現場測試都在這裡完成。穩定版保留在 GitHub 的 live-version，這裡可以放心測新版。</p>
    </section>

    <section class="card section control-card">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Step 1</p>
          <h2>建立本場遊戲</h2>
        </div>
        <div id="gameConfigSummary" class="status-chip">尚未建立</div>
      </div>

      <div class="form-row">
        <label>
          開放組數
          <input id="teamCount" type="number" min="1" max="15" value="15" />
        </label>
        <label>
          每組人數
          <input id="teamSize" type="number" min="1" max="99" value="4" />
        </label>
        <label>
          預估總人數
          <input id="totalPlayersPreview" type="number" readonly value="60" />
        </label>
      </div>

      <div class="toolbar">
        <button id="bootstrapBtn" class="primary-action">建立遊戲與組別</button>
        <button id="gameStartBtn">遊戲開始</button>
        <button id="fullResetBtn" class="danger-button">一鍵重置全部資料</button>
      </div>
      <p class="muted">建立遊戲會清空舊玩家、舊魔王、舊訂單與各組資料；請在正式開始前設定好組數與每組人數。</p>
    </section>

    <section class="card section">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Mission</p>
          <h2>訂單與魔王</h2>
        </div>
      </div>

      <div class="toolbar">
        <button id="nextOrderBtn">發布下一張訂單</button>
        <button id="clearOrderBtn">清空目前訂單</button>
        <button id="boss1Btn">開啟魔王 1</button>
        <button id="boss2Btn">開啟魔王 2</button>
        <button id="boss3Btn">開啟魔王 3</button>
        <button id="boss4Btn">開啟魔王 4</button>
        <button id="clearBossBtn">清空魔王</button>
      </div>
    </section>

    <section class="card section">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Custom Boss</p>
          <h2>自訂魔王</h2>
        </div>
      </div>

      <div class="form-row">
        <label>
          魔王名稱
          <input id="customBossName" placeholder="例如：手機成癮獸" />
        </label>
        <label>
          魔王血量
          <input id="customBossHp" type="number" min="1" value="20" />
        </label>
      </div>
      <div id="customBossMaterials" class="form-grid material-grid"></div>
      <div class="toolbar">
        <button id="openCustomBossBtn">開啟自訂魔王</button>
      </div>
    </section>

    <section class="card section">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Live Tools</p>
          <h2>現場控制</h2>
        </div>
      </div>

      <div class="toolbar">
        <button id="randomDownBtn">隨機一位正常玩家沒電</button>
        <button id="restoreDownBtn">恢復所有沒電玩家</button>
        <button id="clearPlayersBtn">清空舊玩家</button>
        <button id="releaseNumbersBtn">釋放玩家號碼</button>
        <button id="clearTeamDataBtn">清空各組分數與庫存</button>
      </div>
    </section>

    <section class="card section">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Test Lab</p>
          <h2>測試工具</h2>
        </div>
      </div>

      <div class="form-row">
        <label>
          玩家代號
          <input id="targetPlayerCode" placeholder="A01 / B03 / O04" />
        </label>
        <label>
          指定材料
          <select id="carryMaterial"></select>
        </label>
        <label>
          直接加分組別
          <select id="scoreTeam"></select>
        </label>
      </div>

      <div class="toolbar">
        <button id="createTestPlayersBtn">建立測試玩家</button>
        <button id="setCarryBtn">給某玩家材料</button>
        <button id="clearCarryBtn">清空某位玩家攜帶材料</button>
        <button id="setDownBtn">讓指定玩家沒電</button>
        <button id="addScoreBtn">分數 +10</button>
      </div>
    </section>

    <section class="card section">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Players</p>
          <h2>玩家列表</h2>
        </div>
        <div id="playerCountBadge" class="status-chip">0 人</div>
      </div>
      <div id="playerList" class="list player-admin-list"></div>
    </section>

    <section class="card section">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Log</p>
          <h2>操作紀錄</h2>
        </div>
      </div>
      <pre id="adminLog" class="log-box"></pre>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
  <script src="./firebase-config.js?v=dev15-20260625-2"></script>
  <script src="./app.js?v=dev15-20260625-2"></script>
  <script src="./admin.js?v=dev15-20260625-2"></script>
</body>
</html>
