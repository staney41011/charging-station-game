<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>投影幕畫面</title>
  <link rel="stylesheet" href="./style.css?v=dev15-20260625-9" />
</head>

<body class="display-body">
  <main class="display-shell battle-display-shell">
    <section class="display-stage battle-stage">
      <div>
        <p class="eyebrow">充電站營業中</p>
        <h1 id="displayStatus">等待主持人開始遊戲</h1>
        <p id="displayMessage">請玩家加入遊戲，等待主持人開始。</p>
      </div>
      <div class="display-live-chip" id="displayCounts">0 人加入</div>
    </section>

    <section class="projector-card battle-arena" id="battlePanel"></section>

    <section class="projector-card score-wall-card">
      <div class="projector-heading">
        <span>組別比分牆</span>
        <small>依分數排序，最多 15 組同時顯示</small>
      </div>
      <div id="rankGrid" class="score-wall-grid"></div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
  <script src="./firebase-config.js?v=dev15-20260625-9"></script>
  <script src="./app.js?v=dev15-20260625-9"></script>
  <script src="./display.js?v=dev15-20260625-9"></script>
</body>
</html>
