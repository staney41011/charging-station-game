<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>投影幕畫面</title>
  <link rel="stylesheet" href="./style.css" />
</head>

<body class="display-body">
  <main class="display-shell">
    <section class="display-stage">
      <div>
        <p class="eyebrow">充電站營業中</p>
        <h1 id="displayStatus">等待主持人開始遊戲</h1>
        <p id="displayMessage">全場訊息會顯示在這裡。</p>
      </div>
      <div class="display-live-chip" id="displayCounts">0 人加入</div>
    </section>

    <section class="projector-layout">
      <section class="projector-card mission-card" id="missionPanel"></section>
      <section class="projector-card danger-card" id="downPanel"></section>
    </section>

    <section class="projector-card rank-card">
      <div class="projector-heading">
        <span>組別排行榜</span>
        <small>分數 · 訂單 · 支援 · 魔王</small>
      </div>
      <div id="rankGrid" class="rank-grid-projector"></div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
  <script src="./firebase-config.js"></script>
  <script src="./app.js"></script>
  <script src="./display.js"></script>
</body>
</html>
