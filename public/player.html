<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩家入口</title>
  <link rel="stylesheet" href="style.css" />

  <style>
    #scannerSection[hidden] {
      display: none !important;
    }

    #scannerSection:not([hidden]) {
      display: block !important;
    }

    #qr-reader {
      width: 100%;
      max-width: 420px;
      min-height: 320px;
      margin: 16px auto;
      background: #f2f2f2;
      border: 3px solid #333;
      border-radius: 12px;
      overflow: hidden;
    }

    #qr-reader video {
      width: 100% !important;
      height: auto !important;
      display: block !important;
    }

    #qr-reader__scan_region,
    #qr-reader__dashboard {
      color: #111 !important;
    }

    .rescue-qr-card {
      background: #ffffff;
      color: #000000;
      border-radius: 20px;
      padding: 20px;
      margin: 16px auto;
      width: min(96vw, 420px);
      text-align: center;
      border: 4px solid #111111;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }

    .rescue-qr-title {
      font-size: 1.2rem;
      font-weight: 900;
      margin-bottom: 10px;
    }

    .rescue-qr-code {
      font-size: 2.4rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      margin-top: 12px;
    }

    .rescue-qr-card canvas,
    .rescue-qr-card img {
      width: 320px !important;
      height: 320px !important;
      max-width: 86vw !important;
      max-height: 86vw !important;
      background: #ffffff !important;
      padding: 8px;
    }

    .down-title {
      font-size: 2rem;
      font-weight: 900;
    }

    .down-progress {
      font-size: 3rem;
      font-weight: 900;
      margin: 12px 0;
    }
  </style>
</head>

<body class="player-body">
  <main class="shell page player-shell">
    <section class="card section player-header">
      <div class="player-topline">
        <div>
          <p class="eyebrow">玩家入口</p>
          <h1 id="playerTitle">請先加入遊戲</h1>
          <p class="muted" id="playerSubtitle">等待主持人開始遊戲，請先完成加入。</p>
        </div>
        <div class="player-status-badge" id="playerStatusBadge">尚未加入</div>
      </div>

      <div class="player-summary">
        <div class="summary-item">
          <span class="muted">玩家代碼</span>
          <strong id="summaryCode">-</strong>
        </div>
        <div class="summary-item">
          <span class="muted">暱稱</span>
          <strong id="summaryNickname">-</strong>
        </div>
        <div class="summary-item">
          <span class="muted">組別</span>
          <strong id="summaryTeam">-</strong>
        </div>
        <div class="summary-item">
          <span class="muted">狀態</span>
          <strong id="summaryStatus">-</strong>
        </div>
        <div class="summary-item">
          <span class="muted">目前攜帶</span>
          <strong id="summaryCarry">-</strong>
        </div>
      </div>
    </section>

    <section class="card section">
      <h2>第一次加入遊戲</h2>
      <div class="form-row">
        <label>
          組別
          <select id="team"></select>
        </label>

        <label>
          玩家代碼
          <select id="code"></select>
        </label>

        <label>
          暱稱
          <input id="nickname" placeholder="輸入暱稱" />
        </label>
      </div>

      <div class="toolbar">
        <button type="button" id="joinBtn">加入遊戲</button>
        <button type="button" id="refreshBtn">重新載入名單</button>
      </div>

      <div id="joinPreview" class="result-banner" style="margin-top:12px;">
        請先選擇組別與玩家代碼
      </div>
    </section>

    <section class="card section">
      <h2>回到遊戲</h2>
      <div class="form-row">
        <label>
          玩家代號
          <input id="returnCode" placeholder="A01 / B03 / C04" />
        </label>
      </div>

      <div class="toolbar">
        <button type="button" id="lookupReturnBtn">查詢玩家代號</button>
        <button type="button" id="confirmReturnBtn" hidden>確認回到遊戲</button>
      </div>

      <div id="returnConfirm" class="result-banner" style="margin-top:12px;" hidden></div>
    </section>

    <section class="card section player-action-card" id="activeActionCard">
      <h2 id="actionHeading">現場操作</h2>

      <button type="button" id="scanQrBtn" class="primary-btn">掃描二維碼</button>
      <button type="button" id="testCameraBtn" class="primary-btn no-print" style="margin-top:12px;">測試相機</button>

      <p class="muted action-hint">
        掃不到時才使用手動輸入，正常玩法仍以跑到材料站掃 QR 為主。
      </p>

      <label class="manual-entry">
        手動輸入 QR 代碼
        <textarea id="payload" placeholder="MATERIAL:wire / WAREHOUSE:team1 / BOSS:CENTRAL / RESCUE:C04"></textarea>
      </label>

      <div class="toolbar">
        <button type="button" id="applyPayloadBtn">送出掃碼內容</button>
      </div>
    </section>

    <section class="card section" id="scannerSection" hidden>
      <h2>掃描器</h2>
      <div id="qr-reader"></div>
      <p class="muted">相機開啟後，請將二維碼放在框線中央。</p>
      <div class="toolbar">
        <button type="button" id="stopScannerBtn">停止掃描</button>
      </div>
    </section>

    <section class="card section" id="downSection" hidden>
      <h2 class="down-title">你沒電了</h2>
      <div class="down-progress" id="downProgress">0 / 5</div>
      <p class="down-note">請讓 5 位不同玩家掃你的 QR，你才會恢復行動。</p>

      <div class="down-qr-wrap">
        <div id="downQr"></div>
      </div>

      <p class="muted">系統掃碼內容：<strong id="downQrText">RESCUE:----</strong></p>
    </section>

    <section class="card section">
      <h2>操作結果</h2>
      <div id="resultBanner" class="result-banner">等待加入遊戲</div>
      <div id="playerCard" class="player-card">
        <span class="muted">尚未加入玩家</span>
      </div>
    </section>
  </main>

  <script src="vendor/qrcode.min.js"></script>
  <script src="vendor/html5-qrcode.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
  <script src="player.js"></script>
</body>
</html>
