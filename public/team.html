<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>組別戰情頁｜國高中班</title>
  <link rel="stylesheet" href="./style.css?v=highschool-1" />
</head>

<body class="team-body">
  <main class="shell page team-shell">
    <section class="hero card team-hero">
      <div>
        <p class="eyebrow">組別戰情</p>
        <h1 id="teamName">請選擇組別</h1>
        <p class="lede">此版本由所有玩家共同分工，本頁僅作為查看組別任務、成員狀態與全場訊息的輔助頁。</p>
      </div>
      <div class="team-controls team-controls-simple">
        <label>
          查看組別
          <select id="teamSelect"></select>
        </label>
      </div>
    </section>

    <section id="teamStats" class="stat-grid"></section>

    <section class="team-dashboard-grid">
      <section class="card section focus-card team-dashboard-card order-panel">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Task</p>
            <h2>目前任務</h2>
          </div>
        </div>
        <div id="taskBox" class="list"></div>
      </section>

      <section class="card section team-dashboard-card members-panel">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Members</p>
            <h2>組員狀態</h2>
          </div>
        </div>
        <div id="memberList" class="list"></div>
      </section>

      <section class="card section team-dashboard-card inventory-panel">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Final</p>
            <h2>大型任務貢獻</h2>
          </div>
        </div>
        <div id="finalBox" class="list"></div>
      </section>
    </section>

    <section class="card section team-message-card">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Broadcast</p>
          <h2>全場訊息</h2>
        </div>
      </div>
      <div id="messageText" class="message-strip">等待主持人訊息。</div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
  <script src="./firebase-config.js?v=highschool-1"></script>
  <script src="./app.js?v=highschool-1"></script>
  <script src="./team.js?v=highschool-1"></script>
</body>
</html>
